<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Dashboard POC</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: #1f1f1f;
        border-bottom: 1px solid #444;
    }

    .dashboard {
        height: calc(100vh - 60px);
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 4px;
        padding: 4px;
    }

    .panel {
        position: relative;
        border: 1px solid #444;
        overflow: hidden;
        background: #000;
    }

    .panel-title {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        background: rgba(0,0,0,.75);
        padding: 6px 10px;
        font-size: 14px;
        font-weight: bold;
    }

    .local-radar {
        grid-row: span 2;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .status {
        font-size: 14px;
        color: #ccc;
    }
</style>
</head>

<body>

<header>
    <h2>Weather Dashboard POC</h2>
    <div class="status" id="lastRefresh"></div>
</header>

<div class="dashboard">

    <div class="panel local-radar">
        <div class="panel-title">Local Radar</div>

        <iframe
            src="https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOiJ3ZWF0aGVyIiwiY2VudGVyIjpbLTEwMC43ODEsNDcuMzgzXSwibG9jYXRpb24iOlstMTAwLjc3NCw0Ni44MTZdLCJ6b29tIjo3LjY3NDY5OTUwNDYxODcyNywibGF5ZXIiOiJicmVmX3FjZCJ9LCJhbmltYXRpbmciOnRydWUsImJhc2UiOiJzdGFuZGFyZCIsImFydGNjIjpmYWxzZSwiY291bnR5IjpmYWxzZSwiY3dhIjpmYWxzZSwicmZjIjpmYWxzZSwic3RhdGUiOmZhbHNlLCJtZW51Ijp0cnVlLCJzaG9ydEZ1c2VkT25seSI6ZmFsc2UsIm9wYWNpdHkiOnsiYWxlcnRzIjowLjgsImxvY2FsIjowLjYsImxvY2FsU3RhdGlvbnMiOjAuOCwibmF0aW9uYWwiOjAuNn19">
        </iframe>

    </div>

    <div class="panel">
        <div class="panel-title">National Radar</div>

        <iframe
            src="https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOm51bGwsImNlbnRlciI6Wy05NS41NjIsMzkuNTY4XSwibG9jYXRpb24iOm51bGwsInpvb20iOjQuMzMzMzMzMzMzMzMzMzMzfSwiYW5pbWF0aW5nIjp0cnVlLCJiYXNlIjoic3RhbmRhcmQiLCJhcnRjYyI6ZmFsc2UsImNvdW50eSI6ZmFsc2UsImN3YSI6ZmFsc2UsInJmYyI6ZmFsc2UsInN0YXRlIjpmYWxzZSwibWVudSI6dHJ1ZSwic2hvcnRGdXNlZE9ubHkiOmZhbHNlLCJvcGFjaXR5Ijp7ImFsZXJ0cyI6MC44LCJsb2NhbCI6MC42LCJsb2NhbFN0YXRpb25zIjowLjgsIm5hdGlvbmFsIjowLjZ9fQ%3D%3D">
        </iframe>

    </div>

    <div class="panel">
        <div class="panel-title">Air Quality</div>

        <iframe
            src="https://gispub.epa.gov/airnow/?contours=ozonepm&monitors=none&xmin=-12245196.475292878&xmax=-9909280.890898513&ymin=5514871.866480421&ymax=6467582.987026606&tab=loops">
        </iframe>

    </div>

</div>

<script>

function updateRefreshTime() {
    const now = new Date();

    document.getElementById('lastRefresh').innerText =
        'Loaded: ' + now.toLocaleString();
}

updateRefreshTime();

/*
    Refresh every 15 minutes.
    Later we'll make this configurable.
*/
setInterval(() => {
    location.reload();
}, 900000);

</script>

</body>
</html>
