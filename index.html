<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ND Situational Awareness Dashboard</title>

<style>
:root {
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2a2f3a;
    --text:#e6edf3;
    --muted:#9aa4b2;
    --red:#ff4d4d;
    --green:#2ea043;
    --yellow:#d29922;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body {
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* HEADER */
header {
    height:56px;
    background:var(--panel);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--border);
}

header h1 {
    font-size:14px;
}

#status {
    font-size:12px;
    color:var(--muted);
}

/* CONTROL BAR */
.controls {
    display:flex;
    gap:6px;
    padding:6px;
    background:#0b0f14;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
}

button {
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
}

button:hover {
    border-color:#58a6ff;
}

/* OVERVIEW */
#overview {
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:2fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:6px;
    padding:6px;
}

.tile {
    background:#000;
    border:1px solid var(--border);
    position:relative;
    overflow:hidden;
}

.tile-title {
    position:absolute;
    top:0;
    left:0;
    background:rgba(0,0,0,0.6);
    padding:4px 6px;
    font-size:11px;
    z-index:2;
}

/* LOCAL RADAR BIG */
#localTile {
    grid-row:span 2;
}

/* IMPORTANT: iframe must fully fill */
iframe {
    width:100%;
    height:100%;
    border:none;
}

/* MAP VIEW */
#mapView {
    display:none;
    height:calc(100vh - 100px);
}

#mapView iframe {
    width:100%;
    height:100%;
    border:none;
}

/* CONDITIONS */
.conditions {
    padding:10px;
    font-size:13px;
    line-height:1.6;
    overflow:auto;
    height:100%;
}

.big {
    font-size:18px;
    font-weight:bold;
}

/* TOGGLES */
.toggle-on {
    border-color:var(--green);
}

.toggle-off {
    border-color:var(--red);
}
</style>

</head>

<body>

<header>
    <h1>ND Situational Awareness Dashboard</h1>
    <div id="status">Initializing...</div>
</header>

<div class="controls">
    <button onclick="showOverview()">Overview</button>
    <button onclick="loadMap('local')">Local Radar</button>
    <button onclick="loadMap('national')">National Radar</button>
    <button onclick="loadMap('air')">Air Quality</button>
    <button onclick="loadMap('river')">River Conditions</button>

```
<button id="autoRotateBtn" onclick="toggleRotate()">Auto Rotate: ON</button>
<button id="autoRefreshBtn" onclick="toggleRefresh()">Auto Refresh: ON</button>
```

</div>

<!-- OVERVIEW -->

<div id="overview">

```
<div class="tile" id="localTile">
    <div class="tile-title">Local Radar</div>
    <iframe id="localRadar"></iframe>
</div>

<div class="tile">
    <div class="tile-title">Current Conditions (KBIS)</div>
    <div class="conditions">
        <div class="big">Bismarck, ND</div><br>

        Temperature: -- °F<br>
        Wind: -- mph<br>
        Visibility: -- mi<br>
        Pressure: -- inHg<br><br>

        AQI: --<br>
        Alerts: --<br><br>

        Last Update: --<br>
    </div>
</div>

<div class="tile">
    <div class="tile-title">National Radar</div>
    <iframe id="nationalRadar"></iframe>
</div>

<div class="tile">
    <div class="tile-title">Air Quality</div>
    <iframe id="airQuality"></iframe>
</div>
```

</div>

<!-- MAP VIEW -->

<div id="mapView">
    <iframe id="mapFrame"></iframe>
</div>

<script>

/* =========================
   MAP SOURCES (NO WRAPPING)
========================= */

const MAPS = {
    local: "https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsiaWQiOiJ3ZWF0aGVyIiwiY2VudGVyIjpbLTEwMC43ODEsNDcuMzgzXSwibG9jYXRpb24iOlstMTAwLjc3NCw0Ni44MTZdLCJ6b29tIjo3fSwiYW5pbWF0aW5nIjp0cnVlfQ==",

    national: "https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsicG9zaXRpb24iOlsiLTk1LjU2MiIsIjM5LjU2OCJdLCJ6b29tIjo0LjN9LCJhbmltYXRpbmciOnRydWV9",

    air: "https://gispub.epa.gov/airnow/?contours=ozonepm&tab=loops",

    river: "https://dashboard.waterdata.usgs.gov/app/nwd/en/"
};

/* =========================
   STATE
========================= */

let rotate = true;
let refresh = true;

let rotateIndex = 0;

const rotateList = ["local","national","air","river"];

/* =========================
   INIT
========================= */

function init() {
    document.getElementById("localRadar").src = MAPS.local;
    document.getElementById("nationalRadar").src = MAPS.national;
    document.getElementById("airQuality").src = MAPS.air;

    updateStatus();
}

/* =========================
   NAV
========================= */

function showOverview() {
    document.getElementById("overview").style.display = "grid";
    document.getElementById("mapView").style.display = "none";
}

function loadMap(type) {
    document.getElementById("overview").style.display = "none";
    document.getElementById("mapView").style.display = "block";
    document.getElementById("mapFrame").src = MAPS[type];
}

/* =========================
   TOGGLES
========================= */

function toggleRotate() {
    rotate = !rotate;
    const btn = document.getElementById("autoRotateBtn");
    btn.textContent = "Auto Rotate: " + (rotate ? "ON" : "OFF");
}

function toggleRefresh() {
    refresh = !refresh;
    const btn = document.getElementById("autoRefreshBtn");
    btn.textContent = "Auto Refresh: " + (refresh ? "ON" : "OFF");
}

/* =========================
   AUTO ROTATE
========================= */

setInterval(() => {
    if (!rotate) return;

    rotateIndex = (rotateIndex + 1) % rotateList.length;
    loadMap(rotateList[rotateIndex]);

}, 15000);

/* =========================
   AUTO REFRESH SAFE
========================= */

setInterval(() => {
    if (!refresh) return;

    const frame = document.getElementById("mapFrame");

    if (frame.src) {
        frame.src = frame.src;
    }

}, 300000);

/* =========================
   STATUS
========================= */

function updateStatus() {
    document.getElementById("status").innerText =
        "Loaded: " + new Date().toLocaleTimeString();
}

setInterval(updateStatus, 60000);

init();

</script>

</body>
</html>
