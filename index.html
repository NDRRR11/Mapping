<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ND Situational Awareness Dashboard</title>

<style>
:root {
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2a2f3a;
    --text:#e6edf3;
    --muted:#9aa4b2;
}

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body {
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* HEADER */
header {
    height:56px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
}

header h1 {
    font-size:14px;
}

#status {
    font-size:12px;
    color:var(--muted);
}

/* CONTROL BAR */
.controls {
    display:flex;
    gap:6px;
    padding:6px;
    background:#0b0f14;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
}

button {
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
}

button:hover {
    border-color:#58a6ff;
}

/* OVERVIEW GRID (FIXED HIERARCHY) */
#overview {
    height:calc(100vh - 100px);
    display:grid;

    grid-template-columns: 2.2fr 1fr;
    grid-template-rows: 1fr 1fr;

    gap:6px;
    padding:6px;
}

/* MAIN MAP (LOCAL RADAR) */
#localTile {
    grid-row: span 2;
    position:relative;
    background:#000;
    border:1px solid var(--border);
    overflow:hidden;
}

/* SECONDARY MAPS */
.tile {
    position:relative;
    background:#000;
    border:1px solid var(--border);
    overflow:hidden;
}

/* TILE LABEL */
.label {
    position:absolute;
    top:0;
    left:0;
    font-size:11px;
    background:rgba(0,0,0,0.65);
    padding:4px 6px;
    z-index:2;
}

/* IFRAME FIX (CRITICAL) */
iframe {
    width:100%;
    height:100%;
    border:none;
}

/* CONDITIONS — NOW SMALL FLOATING CARD */
#conditionsCard {
    position:absolute;
    bottom:10px;
    right:10px;

    width:240px;
    background:rgba(20,20,20,0.92);
    border:1px solid var(--border);
    padding:10px;
    font-size:12px;
    line-height:1.5;
    z-index:5;
}

#conditionsCard strong {
    font-size:13px;
}

/* MAP VIEW */
#mapView {
    display:none;
    height:calc(100vh - 100px);
}

#mapView iframe {
    width:100%;
    height:100%;
}
</style>

</head>

<body>

<header>
    <h1>ND Situational Awareness Dashboard</h1>
    <div id="status">Loading...</div>
</header>

<div class="controls">
    <button onclick="showOverview()">Overview</button>
    <button onclick="loadMap('local')">Local Radar</button>
    <button onclick="loadMap('national')">National Radar</button>
    <button onclick="loadMap('air')">Air Quality</button>
</div>

<!-- OVERVIEW -->

<div id="overview">

```
<!-- LOCAL RADAR (PRIMARY) -->
<div id="localTile">
    <div class="label">Local Radar</div>
    <iframe id="localRadar"></iframe>

    <!-- SMALL OVERLAY CARD -->
    <div id="conditionsCard">
        <strong>Bismarck (KBIS)</strong><br><br>
        Temp: --<br>
        Wind: --<br>
        AQI: --<br>
        Alerts: --<br>
        Updated: --
    </div>
</div>

<!-- NATIONAL RADAR -->
<div class="tile">
    <div class="label">National Radar</div>
    <iframe id="nationalRadar"></iframe>
</div>

<!-- AIR QUALITY -->
<div class="tile">
    <div class="label">Air Quality</div>
    <iframe id="airQuality"></iframe>
</div>
```

</div>

<!-- MAP VIEW -->

<div id="mapView">
    <iframe id="mapFrame"></iframe>
</div>

<script>

/* MAP SOURCES */
const MAPS = {
    local: "https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsicG9zaXRpb24iOlsiLTEwMC43ODEiLCI0Ny4zODM3Il0sInpvb20iOjd9LCJhbmltYXRpbmciOnRydWV9",

    national: "https://radar.weather.gov/?settings=v1_eyJhZ2VuZGEiOnsicG9zaXRpb24iOlsiLTk1LjU2MiIsIjM5LjU2OCJdLCJ6b29tIjo0LjN9LCJhbmltYXRpbmciOnRydWV9",

    air: "https://gispub.epa.gov/airnow/?contours=ozonepm&tab=loops"
};

/* INIT */
function init() {
    document.getElementById("localRadar").src = MAPS.local;
    document.getElementById("nationalRadar").src = MAPS.national;
    document.getElementById("airQuality").src = MAPS.air;

    updateStatus();
}

/* NAV */
function showOverview() {
    document.getElementById("overview").style.display = "grid";
    document.getElementById("mapView").style.display = "none";
}

function loadMap(type) {
    document.getElementById("overview").style.display = "none";
    document.getElementById("mapView").style.display = "block";
    document.getElementById("mapFrame").src = MAPS[type];
}

/* STATUS */
function updateStatus() {
    document.getElementById("status").innerText =
        "Updated: " + new Date().toLocaleTimeString();
}

setInterval(updateStatus, 60000);

init();

</script>

</body>
</html>
